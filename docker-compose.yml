# PHIRE master orchestration file (local development).
#
# This is the file `docker-compose up -d` targets when run from the repo
# root, per README.md and GET_STARTED.md's Quick Start. Dockerfiles it
# will build from live in docker/ (Dockerfile.backend, Dockerfile.frontend).
# See docker/docker-compose.yml for the same service list documented
# alongside those Dockerfiles — keep both in sync until one is retired.
#
# Planned services:
#   - postgres   : PostgreSQL — port 5432. Relational store for
#                  observations, claims, timeline, and audit logs.
#   - ollama     : local LLM inference — port 11434. Model configurable,
#                  default medgemma:8b-q4_0 (~4GB), alternatives
#                  qwen2:7b-instruct-q4_0 / meditron:7b-q4_0.
#   - backend    : FastAPI app — port 8000 (build: docker/Dockerfile.backend,
#                  context: ./backend). Reads backend/.env.
#   - frontend   : Next.js app — port 3000 (build: docker/Dockerfile.frontend,
#                  context: ./frontend). Reads frontend/.env.
#   - nginx      : reverse proxy in front of frontend/backend (optional,
#                  see docker/nginx.conf).
#
# Chroma is deliberately NOT a service here — it runs in-process from
# Python (see ml/rag/retriever.py) as PHIRE's vector store for RAG; only
# add a container for it if that changes.
#
# Privacy constraint: no service in this file may call out to external/
# cloud APIs — all inference and storage must stay on the local network.
#
# Not yet implemented — placeholder only.
