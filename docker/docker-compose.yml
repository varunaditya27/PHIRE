# PHIRE service orchestration (local deployment).
#
# Run from the repo root with the root .env passed EXPLICITLY:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
# (scripts/run.sh does this, adds the GPU override when an NVIDIA runtime is
# present, and waits for health.) --env-file is required: Compose reads `.env`
# from the compose file's own directory (docker/), not the repo root, so
# without it every setting in the root .env -- ports, passwords, model -- was
# silently ignored.
#
# Privacy constraints:
#  - no service calls external/cloud APIs; all inference and storage stay local.
#    (First run does download model *weights* -- the Hugging Face models, and
#    Ollama's chat model if you use the container Ollama; no patient data leaves
#    the machine.)
#  - every published port is bound to 127.0.0.1. PHIRE has no authentication,
#    so nothing is reachable from the LAN unless you opt in (the `proxy`
#    profile below, or editing a port binding).
#
# backend runs with network_mode: host, not compose's default bridge network:
# ml.llm.ollama_client.OllamaClient and ml.graph.client.GraphClient both call
# ml.local_only.require_localhost() on their configured host, which only
# accepts a URI whose hostname is literally localhost/127.0.0.1/::1 -- a
# bridge-network service name like "ollama" or "neo4j" fails that check even
# though the connection would otherwise work (see ml/local_only.py's docstring:
# it closes a real prefix-bypass privacy hole, so it is not routed around
# here). Host networking makes every other container's *published* port
# reachable at localhost from inside the backend container, which satisfies the
# check without touching ml/'s code. Trade-off: host networking is Linux-native;
# Docker Desktop (Mac/Windows) only has a beta opt-in (4.29+) -- see
# docs/BACKEND_HANDOFF.md section 8 ("How to run it").
#
# Ollama: the backend talks to the Ollama already running on the HOST (OLLAMA_HOST,
# default http://localhost:11434) -- no second copy of the model, no extra GPU
# contention. Only if you have no host Ollama, enable the bundled one with
# `--profile ollama` (scripts/run.sh does this automatically when none is found).
#
# GPU: lift (4-bit, ~6.5GiB) and the chat models cannot share an 8GB card, so the
# backend swaps them (backend/app/services/gpu_modes.py) -- run ONE backend
# worker. GPU reservations live in docker-compose.gpu.yml so this file also
# works on hosts without an NVIDIA runtime (chat then runs on CPU; lift is not
# practical on CPU).

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    # Plain Postgres: it is relational-only (Chroma is the vector store; no pgvector anywhere).
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phire}
      POSTGRES_DB: ${POSTGRES_DB:-phire}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phire}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    <<: *restart
    profiles: ["ollama"]  # opt-in: only when there is no Ollama on the host
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      # A named volume by default; set OLLAMA_MODELS_DIR to a host path to reuse models you already pulled.
      # (Only used with `--profile ollama`.)
      - ${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: make sure the chat model is present before the backend starts, so the
  # first chat doesn't fail on a missing model. Skips the download if it is already there.
  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-medgemma:4b}
    entrypoint: ["/bin/sh", "-c", "ollama list | grep -q \"$$OLLAMA_MODEL\" || ollama pull \"$$OLLAMA_MODEL\""]

  neo4j:
    <<: *restart
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-phire-dev-password}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *restart
    image: phire-backend  # shared with `ingest` so the image is built once
    build:
      # Repo root, not ../backend -- Dockerfile.backend also installs
      # ml/requirements.txt, which needs ml/ in the build context.
      context: ..
      dockerfile: docker/Dockerfile.backend
    network_mode: host
    # Match the host user so files written to the bind-mounted data dir are yours, not root's.
    user: "${PHIRE_UID:-1000}:${PHIRE_GID:-1000}"
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-phire}:${POSTGRES_PASSWORD:-phire}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-phire}
      # Host Ollama by default; with `--profile ollama` the container publishes OLLAMA_PORT on localhost too.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:${OLLAMA_PORT:-11434}}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-medgemma:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      NEO4J_URI: bolt://localhost:${NEO4J_BOLT_PORT:-7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-phire-dev-password}
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/documents
      AUDIT_LOG_PATH: /app/data/audit.log
      # Derived from FRONTEND_PORT so changing the port can't leave CORS pointing at the old one.
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
      # Loopback by default (no auth); set BACKEND_HOST=0.0.0.0 only behind the proxy profile on a trusted LAN.
      BACKEND_HOST: ${BACKEND_HOST:-127.0.0.1}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    volumes:
      # Uploads, Chroma (incl. the reference corpus), the audit log and run_ingest's manifest live in the
      # repo's data/ so they survive rebuilds and are shared with a local (non-Docker) run. Mounted at
      # /app/data because ml/ resolves its own data paths relative to its repo root (/app here).
      # Seed the reference corpus with `docker compose ... --profile ingest run --rm ingest`.
      - ${PHIRE_DATA_DIR:-../data}:/app/data:z
      # Hugging Face weights (lift 18GB, MedCPT, BART): a named volume by default; set HF_CACHE_DIR to a
      # host path (e.g. ~/.cache/huggingface) to reuse a cache you already have. The `:z` on bind mounts
      # relabels them for SELinux (Fedora/RHEL); without it the container gets "Permission denied".
      - ${HF_CACHE_DIR:-hf_cache}:/hf:z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}/api/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
        required: false  # absent unless the `ollama` profile is enabled

  # One-shot corpus seeding (public MedlinePlus/PubMed/USDA reference evidence; needs network).
  ingest:
    profiles: ["ingest"]
    image: phire-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    network_mode: host
    user: "${PHIRE_UID:-1000}:${PHIRE_GID:-1000}"
    restart: "no"
    environment:
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - ${PHIRE_DATA_DIR:-../data}:/app/data:z
      - ${HF_CACHE_DIR:-hf_cache}:/hf:z
    entrypoint: ["python", "-m", "ml.rag.ingest.run_ingest"]

  frontend:
    <<: *restart
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* values are inlined into the JS bundle at build time, so this must be a build
        # arg (a runtime `environment:` entry has no effect). Empty = same-origin (use with `proxy`).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:${BACKEND_PORT:-8000}}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    profiles: ["proxy"]  # opt-in: `docker compose --profile proxy up`
    network_mode: host   # see nginx.conf.template's header comment -- same reason as `backend`'s
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      PROXY_PORT: ${PROXY_PORT:-8080}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  ollama_models:
  neo4j_data:
  hf_cache:
