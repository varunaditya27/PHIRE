# Optional reverse proxy in front of frontend (:3000) and backend (:8000),
# so the whole app is reachable under one origin on the LAN.
# Enable via: docker compose --profile proxy up
#
# Targets localhost, not the "backend"/"frontend" service names -- this
# service runs with network_mode: host (see docker-compose.yml's `nginx`
# entry), the same fix backend itself uses, because backend is
# host-networked and doesn't answer on the bridge network's "backend:8000"
# at all. With host networking, frontend's published port (3000) is
# reachable at localhost from here too, same as backend's own :8000.

events {}

http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://localhost:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;          # required for SSE (/api/chat)
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://localhost:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
