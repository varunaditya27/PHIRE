# Optional reverse proxy in front of frontend (:3000) and backend (:8000),
# so the whole app is reachable under one origin on the LAN.
# Enable via: docker compose --profile proxy up

events {}

http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;          # required for SSE (/api/chat)
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
